[project]
name = "agentproof"
version = "0.2.0"
description = "Production-oriented AI agent reliability, regression testing, and release-gating platform"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "tenacity>=9.0",
  "typer>=0.12",
  "rich>=13.7",
  "plotly>=5.23",
  "streamlit>=1.38",
]

[project.optional-dependencies]
dev = ["pytest>=8.3","pytest-cov>=5.0","ruff>=0.6","mypy>=1.11"]
benchmarks = ["datasets>=3.0"]
stats = ["statsmodels>=0.14"]
observability = ["opentelemetry-api>=1.30", "opentelemetry-sdk>=1.30"]
mcp = ["mcp"]

[project.scripts]
agentproof = "agentproof.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-config --strict-markers"

[tool.ruff]
line-length = 100
